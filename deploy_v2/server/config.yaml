gateway:
  host: 0.0.0.0
  port: 8000
  request_timeout: 3600
  routes:
    /v1/audio: comfyui_api
    /v1/images: comfyui_api
    /v1/videos: comfyui_api

services:
  comfyui_api:
    base_url: http://127.0.0.1:8100
    host: 127.0.0.1
    port: 8100
    comfyui_url: http://127.0.0.1:8188
    poll_interval: 1
    workflow_timeout: 3600
    workflows:
      qwen-image-2512: qwen-image-2512_api.json
      qwen-image-edit-2511: qwen-image-edit-2511_api.json
      qwen-image-edit-2511-lightning-4step: qwen-image-edit-2511_lightning-4step_api.json
      qwen-image-edit-2511-multi: qwen-image-edit-2511-multi_api.json
      qwen-image-edit-2511-multi-lightning-4step: qwen-image-edit-2511-multi-lightning-4step_api.json
      ltx-2.3: ltx-2.3-t2v-i2v-two-stage-distilled_api.json
      ltx-2.3-t2a-single-stage-distilled: ltx-2.3-t2a-single-stage-distilled_api.json
      ltx-2.3-t2v-i2v-single-stage-distilled-full: ltx-2.3-t2v-i2v-single-stage-distilled-full_api.json
      ltx-2.3-iclora-hdr-distilled: ltx-2.3-iclora-hdr-distilled_api.json
      ltx-2.3-iclora-ingredients-single-stage-distilled: ltx-2.3-iclora-ingredients-single-stage-distilled_api.json
      ltx-2.3-iclora-inpaint-two-stage-distilled: ltx-2.3-iclora-inpaint-two-stage-distilled_api.json
      ltx-2.3-iclora-lipdub-two-stage-distilled: ltx-2.3-iclora-lipdub-two-stage-distilled_api.json
      ltx-2.3-iclora-motion-track-distilled: ltx-2.3-iclora-motion-track-distilled_api.json
      ltx-2.3-iclora-outpaint-two-stage-distilled: ltx-2.3-iclora-outpaint-two-stage-distilled_api.json
      ltx-2.3-iclora-pixel-spatial-upscaler-distilled: ltx-2.3-iclora-pixel-spatial-upscaler-distilled_api.json
      ltx-2.3-iclora-union-control-distilled: ltx-2.3-iclora-union-control-distilled_api.json
      ltx-2.3-v2v-iclora-single-stage-distilled: ltx-2.3-v2v-iclora-single-stage-distilled_api.json
      minimax-h3-ref2va-bf16: minimax-h3-ref2va-bf16_api.json
      minimax-h3-ref2va-quantized: minimax-h3-ref2va-quantized_api.json
